[project]
name = "archaeosort-dataset-builder"
version = "0.1.0"
description = "Reproducible dataset construction pipeline for archaeological computer vision."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

authors = [
    { name = "David Falcon Perez" }
]

dependencies = [
    "pyyaml",
    "requests",
    "tqdm",
    "pillow",
    "pandas",
    "numpy",
    "opencv-python",
    "imagehash",
    "scikit-learn",
    "kaggle",
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm>=1.0.28",
    "faiss-cpu>=1.15.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[project.scripts]
archaeosort = "archaeosort_dataset_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archaeosort_dataset_builder"]
