[project]
name = "archaeosort-dataset-builder"
version = "0.1.0"
description = "Reproducible dataset construction pipeline for archaeological computer vision."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

authors = [
    { name = "David Falcon Perez" }
]

dependencies = [
    "pyyaml",
    "requests",
    "tqdm",
    "pillow",
    "pandas",
    "numpy",
    "opencv-python",
    "imagehash",
    "scikit-learn",
    "kaggle",
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm>=1.0.28",
    "faiss-cpu>=1.15.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# GPU (RTX 5070 / Blackwell, driver reports CUDA 13.2 via nvidia-smi) needs a
# CUDA-enabled torch/torchvision build instead of the default CPU-only wheels
# from PyPI. This pins both to PyTorch's own CUDA 13.0 wheel index (cu130),
# which is forward-compatible with a 13.2 driver. If `uv sync` can't resolve
# cu130 wheels for this torch/torchvision version, change "cu130" to "cu128"
# below (CUDA 12.8 wheels also support Blackwell) and re-run `uv sync`.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[tool.ruff]
line-length = 100
target-version = "py312"
# _legacy_archaeosort-ai/: archived reference code from the pre-consolidation
# archaeosort-ai checkout (trained model, an alternative never-integrated
# duplicate-detection implementation) — kept for reference, not part of the
# active package, not actively maintained.
# datasets_repo/: merged-in archaeosort-datasets content (data/catalog
# scripts), not part of the archaeosort_dataset_builder package either.
exclude = ["_legacy_archaeosort-ai", "datasets_repo"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "httpx>=0.28.1",
]

[project.scripts]
archaeosort = "archaeosort_dataset_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archaeosort_dataset_builder"]
